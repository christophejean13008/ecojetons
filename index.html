:root{--texte:#2b1838;--rayon:26px;--ombre:0 10px 30px rgba(20,0,40,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:600;color:#fff;
  background:radial-gradient(ellipse at 20% 0%,#8a3aa3 0%,transparent 55%),radial-gradient(ellipse at 100% 100%,#5b2a8c 0%,transparent 60%),
  linear-gradient(160deg,#3a1856 0%,#4f1f70 45%,#2c1245 100%);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;font-weight:800;cursor:pointer;border:0;color:inherit;background:none}
input,textarea{font-family:inherit;font-weight:700;font-size:17px;user-select:text;-webkit-user-select:text}

/* ---------- décor / univers ---------- */
.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;transition:background .6s}
.deco span{position:absolute;opacity:.35}
.a-flotte{animation:flotte 12s ease-in-out infinite}
@keyframes flotte{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(16deg)}}
.a-monte{animation:monte 11s linear infinite}
@keyframes monte{from{transform:translateY(110vh)}to{transform:translateY(-20vh)}}
.a-derive{animation:derive 40s linear infinite}
@keyframes derive{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.a-scintille{animation:scintille 3s ease-in-out infinite}
@keyframes scintille{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.1)}}
.a-tombe{animation:tombe 13s linear infinite}
@keyframes tombe{from{transform:translateY(-15vh) rotate(0)}to{transform:translateY(115vh) rotate(360deg)}}
.bulle-o{border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.08)}

.ecran{position:fixed;inset:0;display:none;flex-direction:column;z-index:1;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px)}
.ecran.actif{display:flex;animation:entre .28s ease}
@keyframes entre{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.conteneur{width:100%;max-width:980px;margin:0 auto}
.defile{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;padding-bottom:110px}

/* ---------- accueil ---------- */
.entete{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.logo{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:30px;
  background:radial-gradient(circle at 30% 30%,#b25ad6,#6f2a9b);box-shadow:0 0 0 3px rgba(255,255,255,.18),var(--ombre)}
.titre h1{margin:0;font-size:clamp(22px,6vw,32px);font-weight:900;line-height:1.05}
.titre small{display:block;font-size:11px;letter-spacing:.08em;opacity:.75;text-transform:uppercase;margin-top:3px}
.ligne-eleve{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.selecteur-eleve{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.18);font-size:18px;text-align:left}
.selecteur-eleve .fl{margin-left:auto;opacity:.7}
.outils{display:flex;gap:6px}
.btn-rond{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);font-size:21px;display:grid;place-items:center;flex:none}
.btn-rond:active{transform:scale(.92)}
.astuce{font-size:13px;opacity:.7;text-align:center;margin:-4px 0 12px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.carte{position:relative;border-radius:var(--rayon);padding:14px 14px 16px;min-height:170px;overflow:hidden;display:flex;flex-direction:column;color:var(--texte);
  border:3px solid rgba(255,230,140,.85);box-shadow:0 0 0 2px rgba(255,200,60,.25),var(--ombre);text-align:left;transition:transform .15s,opacity .15s;touch-action:pan-y}
.carte:active{transform:scale(.97)}
.carte.sombre{color:#fff}
.carte.fantome{opacity:.3;transform:scale(.95)}
.carte-vol{position:fixed;z-index:40;pointer-events:none;transform:scale(1.06) rotate(-2deg);box-shadow:0 20px 40px rgba(0,0,0,.45)!important}
.carte .filigrane{position:absolute;right:-14px;bottom:-10px;font-size:110px;opacity:.16;pointer-events:none}
.carte .haut{display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.pastille{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.55);flex:none;overflow:hidden}
.pastille img{width:100%;height:100%;object-fit:cover}
.carte.sombre .pastille,.carte.sombre .mini{background:rgba(255,255,255,.18)}
.mini{min-width:34px;height:34px;padding:0 6px;border-radius:17px;display:grid;place-items:center;font-size:15px;background:rgba(255,255,255,.55);margin-left:auto}
.mini+.mini{margin-left:0}
.carte h3{margin:auto 0 0;padding-top:12px;font-size:19px;font-weight:900;line-height:1.15;text-align:center;position:relative;z-index:1}
.carte .meta{font-size:12px;text-align:center;opacity:.8;margin-top:4px;position:relative;z-index:1}
.jauge{height:9px;border-radius:9px;background:rgba(0,0,0,.14);margin-top:12px;overflow:hidden;position:relative;z-index:1}
.jauge i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#ffd34d,#f7931e)}
.vide{opacity:.85;text-align:center;padding:40px 10px;font-size:17px}
.bas{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,rgba(30,8,48,.85) 40%);z-index:5}
.btn-or{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:760px;margin:0 auto;padding:17px 22px;border-radius:22px;font-size:20px;color:#3a2200;
  background:linear-gradient(180deg,#ffd75a,#f7b21c);box-shadow:0 6px 0 #c47f00,0 12px 26px rgba(0,0,0,.3);white-space:nowrap}
.btn-or:active{transform:translateY(4px);box-shadow:0 2px 0 #c47f00,0 6px 14px rgba(0,0,0,.3)}
.btn-or[disabled]{filter:grayscale(.6);opacity:.6}
.btn-sec{padding:14px 20px;border-radius:18px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.25);font-size:17px}
.btn-sec:active{transform:scale(.96)}
.btn-danger{padding:14px 20px;border-radius:18px;background:#ff5d6c;font-size:17px}
.barre{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.barre h2{margin:0;font-size:24px;font-weight:900;flex:1}

/* ---------- séance (mode enfant) ---------- */
#ecran-seance{align-items:center;text-align:center;padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
.travaille{margin-top:6px;max-width:92%}

.travaille .renfo{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(22px,6vw,34px);font-weight:900;margin-top:4px;line-height:1.15}
.travaille .renfo img{width:52px;height:52px;border-radius:14px;object-fit:cover;border:2px solid #fff;flex:none}
.travaille .comport{font-size:16px;opacity:.85;margin-top:4px}
#vis{position:relative;flex:1;width:100%;max-width:640px;display:grid;place-items:center;min-height:220px}
.compteur{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:20px;font-weight:900;font-size:16px}
.zone-btn{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:76px;justify-content:center}
.plus1{position:absolute;left:50%;top:40%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:900;color:#5a3500;
  background:radial-gradient(circle at 35% 30%,#ffe98a,#f7b21c);box-shadow:0 0 0 6px rgba(255,211,77,.35),0 10px 26px rgba(0,0,0,.35);pointer-events:none;animation:plus1 1.1s ease forwards;z-index:4}
@keyframes plus1{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:translateY(-20px) scale(1.15)}100%{opacity:0;transform:translateY(-120px) scale(.9)}}
.bulle{position:absolute;top:2%;left:50%;transform:translateX(-50%);background:#fff;color:var(--texte);padding:10px 18px;border-radius:20px;font-size:19px;font-weight:900;
  box-shadow:var(--ombre);animation:bulleA 2.2s ease forwards;white-space:nowrap;z-index:5;max-width:92%;overflow:hidden;text-overflow:ellipsis}
@keyframes bulleA{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
.pulse-rv{animation:prv .25s}
@keyframes prv{50%{transform:scale(.95)}}
/* minuteur de gain */
.chrono{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);padding:6px 14px 6px 6px;border-radius:40px;font-weight:900}
.chrono svg{width:44px;height:44px;transform:rotate(-90deg)}
.chrono.grand{padding:10px 22px 10px 10px;font-size:20px}
.chrono.grand svg{width:64px;height:64px}
.chrono.pause{opacity:.6}
/* barre parent */
.barre-parent{width:100%;max-width:560px;display:flex;justify-content:space-around;margin-top:10px;padding:6px;border-radius:20px;background:rgba(0,0,0,.18)}
.bp{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border-radius:14px;font-size:20px;min-width:62px;opacity:.75}
.bp small{font-size:10px;font-weight:800;letter-spacing:.02em}
.bp::before{content:'';position:absolute;left:0;bottom:0;height:3px;width:0;background:#ffd34d}
.bp.charge::before{width:100%;transition:width .8s linear}
/* visuels */
.v-escalier{position:relative;width:min(84vw,330px);height:min(46vh,240px)}
.v-escalier .marche{position:absolute;bottom:0;border-radius:8px 8px 0 0;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.v-escalier .marche.neuve{animation:pousse .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pousse{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.v-escalier .sol{position:absolute;left:-10px;right:-10px;bottom:-3px;height:3px;background:rgba(255,255,255,.5);border-radius:3px}
.v-escalier .heros{position:absolute;font-size:46px;line-height:1;transform:translate(-50%,0);transition:left .6s cubic-bezier(.4,1.4,.6,1),bottom .6s cubic-bezier(.4,1.4,.6,1);z-index:2}
.v-escalier .but{position:absolute;right:-6px;top:-8px;font-size:40px;display:flex;flex-direction:column;align-items:center}
.v-escalier .but img{width:48px;height:48px;border-radius:12px;object-fit:cover;border:2px solid #fff}
.v-fusee{position:relative;width:200px;height:min(52vh,340px)}
.v-fusee .piste{position:absolute;left:50%;top:0;bottom:30px;border-left:3px dashed rgba(255,255,255,.25)}
.v-fusee .lune{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:40px}
.v-fusee .lune img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.v-fusee .sol{position:absolute;left:30px;right:30px;bottom:18px;height:14px;border-radius:10px;background:rgba(255,255,255,.25)}
.v-fusee .fusee{position:absolute;left:50%;width:70px;margin-left:-35px;transition:bottom .9s cubic-bezier(.3,1.2,.5,1)}
.v-fusee .flamme{transform-origin:35px 96px;animation:flamme .15s infinite alternate}
@keyframes flamme{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}
.v-fusee .fusee.decolle{transition:bottom 1.3s cubic-bezier(.6,0,.9,.4)}
.v-fusee .fusee.decolle .flamme{transform:scaleY(2)}
.v-camembert{position:relative;width:min(74vw,300px);aspect-ratio:1}
.v-camembert svg{width:100%;height:100%;transform:rotate(-90deg)}
.v-camembert .arc{transition:stroke-dashoffset .9s cubic-bezier(.3,1.2,.5,1)}
.v-camembert .centre{position:absolute;inset:27%;border-radius:50%;background:#2b1840;display:grid;place-items:center;font-size:clamp(46px,14vw,76px);overflow:hidden;box-shadow:inset 0 0 0 4px rgba(255,255,255,.08)}
.v-camembert .centre img{width:100%;height:100%;object-fit:cover}
.v-verre{position:relative;width:min(44vw,170px);height:min(50vh,290px)}
.v-verre svg{width:100%;height:100%;overflow:visible}
.v-verre .eau{transition:transform 1s cubic-bezier(.3,1.1,.5,1)}
.v-verre .vague{animation:vague 2.4s linear infinite}
@keyframes vague{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.v-batterie{display:flex;align-items:center}
.v-batterie .corps{position:relative;width:min(68vw,340px);height:min(32vw,150px);border:8px solid #fff;border-radius:26px;padding:8px}
.v-batterie .niveau{height:100%;border-radius:12px;transition:width .9s cubic-bezier(.3,1.1,.5,1),background .9s;min-width:0}
.v-batterie .eclair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:min(15vw,70px);filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.v-batterie .nub{width:20px;height:56px;background:#fff;border-radius:0 12px 12px 0;margin-left:-2px}

/* ---------- victoire ---------- */
#ecran-victoire{align-items:center;justify-content:center;text-align:center;overflow:hidden}
.rayons{position:absolute;left:50%;top:42%;width:220vmax;height:220vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,255,255,.07) 0 10deg,transparent 10deg 20deg);animation:tourne 30s linear infinite;pointer-events:none}
@keyframes tourne{to{transform:translate(-50%,-50%) rotate(360deg)}}
#confettis{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bravo{font-size:clamp(40px,12vw,72px);font-weight:900;color:#ffd34d;text-shadow:0 4px 0 #c47f00,0 10px 30px rgba(0,0,0,.4);margin:0;position:relative}
.gagne-ico{font-size:clamp(100px,30vw,170px);line-height:1.1;animation:saute 1.4s ease-in-out infinite;position:relative}
.gagne-ico img{width:min(48vw,220px);height:min(48vw,220px);border-radius:30px;object-fit:cover;border:6px solid #fff;box-shadow:var(--ombre)}
@keyframes saute{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(4deg)}}
.gagne-txt{font-size:clamp(24px,7vw,36px);font-weight:900;position:relative}
.gagne-sous{opacity:.85;margin-top:6px;position:relative;font-size:15px}
.victoire-btns{display:flex;gap:12px;margin-top:22px;position:relative;width:100%;max-width:460px}
.victoire-btns>*{flex:1;white-space:nowrap}

/* ---------- formulaires ---------- */
.champ{margin-bottom:18px}
.champ>label,.champ>.lab{display:block;font-weight:900;font-size:16px;margin-bottom:7px}
.etape{display:inline-block;background:#ffd34d;color:#3a2200;border-radius:10px;padding:2px 9px;margin-right:6px;font-size:13px}
.aide{display:block;font-size:13px;opacity:.75;font-weight:600;margin-top:5px;line-height:1.35}
.saisie{width:100%;padding:13px 14px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.95);color:var(--texte);outline:none}

textarea.saisie{min-height:64px;resize:vertical}
.choix-emoji{display:flex;flex-wrap:wrap;gap:7px}

.univers{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}

.univers button span{font-size:24px}
.univers button.sel{border-color:#ffd34d;box-shadow:0 0 0 2px rgba(255,211,77,.4)}
.pas{display:flex;align-items:center;gap:14px}
.pas button{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);font-size:28px}
.pas .val{font-size:34px;font-weight:900;min-width:44px;text-align:center}
.bloc{background:rgba(255,255,255,.06);border-radius:20px;padding:14px;margin-bottom:16px}
.bascule{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.08);margin-bottom:10px}
.bascule .txt{flex:1}
.bascule .txt b{display:block;font-size:16px}
.inter{width:58px;height:34px;border-radius:20px;background:rgba(255,255,255,.25);position:relative;flex:none;transition:background .2s}
.inter::after{content:'';position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
.inter.on{background:#4cd964}
.inter.on::after{left:28px}
.carte-info{background:rgba(255,255,255,.09);border-radius:18px;padding:14px 16px;margin-bottom:14px;line-height:1.45}
.carte-info h3{margin:0 0 6px;font-size:18px;color:#ffd34d}
.carte-info p{margin:6px 0}
.carte-info .dans{background:rgba(255,211,77,.15);border-left:4px solid #ffd34d;padding:6px 10px;border-radius:8px;font-size:14px;margin-top:8px}
.ref{font-size:13px;opacity:.85;margin:0 0 8px;line-height:1.4}
.ligne{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.1)}
.ligne .ico{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:32px;background:rgba(255,255,255,.12);overflow:hidden;flex:none}
.ligne .ico img{width:100%;height:100%;object-fit:cover}
.ligne .txt{flex:1;min-width:0}
.ligne .txt b{display:block;font-size:17px}
.ligne .txt small{opacity:.75}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:rgba(255,255,255,.1);border-radius:18px;padding:12px;text-align:center}
.stat b{display:block;font-size:30px;font-weight:900;color:#ffd34d}
.stat small{font-size:12px;opacity:.8}
.tab-defile{overflow-x:auto}
table.suivi{width:100%;border-collapse:collapse;font-size:13px}

.voile{position:fixed;inset:0;background:rgba(15,0,30,.65);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:16px}
.voile.ouvert{display:flex;animation:entre .2s}
.boite{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:#43196a;border:2px solid rgba(255,255,255,.18);border-radius:26px;padding:20px;box-shadow:var(--ombre)}

.camera video{width:100%;border-radius:18px;background:#000;max-height:55vh;object-fit:cover}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#fff;color:var(--texte);padding:12px 20px;border-radius:30px;font-weight:800;z-index:60;box-shadow:var(--ombre);
  animation:bulleT 2.6s ease forwards;max-width:90%;text-align:center}

}

<body>
<div class="deco" id="deco"></div>

<!-- ========== ACCUEIL ========== -->
<section class="ecran actif" id="ecran-accueil">
  <div class="conteneur defile" id="accueil-defile">
    <div class="entete">
      <div class="logo">⭐</div>
      <div class="titre"><h1 id="titre-accueil">Les tableaux</h1><small>Adaptjetons — économie de jetons</small></div>
    </div>
    <div class="ligne-eleve">
      <button class="selecteur-eleve" onclick="boiteEleves()"><span>👤</span><span id="nom-eleve">—</span><span class="fl">▾</span></button>
      <div class="outils">
        <button class="btn-rond" onclick="aller('suivi')" aria-label="Historique">📊</button>
        <button class="btn-rond" onclick="aller('reperes')" aria-label="Repères">📖</button>
        <button class="btn-rond" onclick="aller('reglages')" aria-label="Réglages">⚙️</button>
        <button class="btn-rond" id="btn-installer" onclick="installer()" aria-label="Installer" style="display:none;background:#ffd34d">📲</button>
      </div>
    </div>
    <div class="astuce" id="astuce-reorg">Appui long sur un tableau pour le déplacer</div>
    <div class="grille" id="grille-tableaux"></div>
  </div>
  <div class="bas"><button class="btn-or" onclick="editerTableau(null)">＋ Nouveau tableau</button></div>
</section>

<!-- ========== SÉANCE ========== -->
<section class="ecran" id="ecran-seance">
  <div class="travaille">
    <div class="sur">ON TRAVAILLE POUR</div>
    <div class="renfo" id="s-renfo"></div>
    <div class="comport" id="s-comport"></div>
  </div>
  <div id="vis"></div>
  <div class="zone-btn" id="zone-btn"></div>
  <div class="barre-parent" id="barre-parent"></div>
</section>

<script>
'use strict';
/* =========================================================
   Adaptjetons 2.1 — économie de jetons
   Appli Android (pont window.Android) ou navigateur.
   ========================================================= */
const CLE = 'adaptjetons_v2';
const N = window.Android || null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const jour = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const alea = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

const COULEURS = [
  {id:'vert', bg:'linear-gradient(160deg,#b8f29b,#8fdc6c)'},
  {id:'nuit', bg:'linear-gradient(160deg,#3b2f95,#221a63)', sombre:true},
  {id:'turquoise', bg:'linear-gradient(160deg,#8fe6f2,#55c6dc)'},
  {id:'peche', bg:'linear-gradient(160deg,#ffd29a,#ffaf62)'},
  {id:'rose', bg:'linear-gradient(160deg,#ffc2dc,#ff8fbd)'},
  {id:'lilas', bg:'linear-gradient(160deg,#ddc8ff,#b393ff)'},
  {id:'jaune', bg:'linear-gradient(160deg,#fff0a0,#ffd84d)'},
  {id:'corail', bg:'linear-gradient(160deg,#ffb3a3,#ff7f6b)'},
  {id:'foret', bg:'linear-gradient(160deg,#2f8f6a,#1d5e45)', sombre:true},
];
const PICTOS = ['🦕','🚀','🐠','🍪','🚲','💺','🙋','✋','📝','📚','✏️','🧹','🎒','🦷','🍽️','🚶','👂','👀','🤝','🧩','🧘','🚻','🧥','💬','🤫','⏳','🐢','🦁','🐸','🦄','🚂','🚗','⚽','🎈','🌈','⭐','🎯','👟','🙌','😊'];
const RECOMP = ['✏️','🎨','📱','🎮','📖','🧩','🧸','🎵','🏃','🚲','⚽','🍪','🍬','🎲','🧱','🖍️','🎧','🎠','💧','🎬','🤸','🐟','🏀','🎤','🌳','🍎','🎈','🚂','🦖','⭐'];
const VISUELS = [
  {id:'escalier', ico:'📶', nom:'Escalier', sous:'Le héros gravit les marches'},
  {id:'fusee', ico:'🚀', nom:'Fusée', sous:'Le décollage final'},
  {id:'camembert', ico:'🍩', nom:'Camembert', sous:'La part se remplit'},
  {id:'verre', ico:'🥛', nom:'Verre d\'eau', sous:'Le niveau monte'},
  {id:'batterie', ico:'🔋', nom:'Batterie', sous:'Du rouge au vert'},
];
/* 7 univers visuels animés */
const UNIVERS = [
  {id:'bonbons', nom:'Bonbons', ico:'🍭', heros:'🐻', fond:'linear-gradient(160deg,#4a1a66,#7a2f8f 50%,#3a1450)', items:['🍭','🍬','✦'], anim:'flotte'},
  {id:'espace', nom:'Espace', ico:'🌙', heros:'👨‍🚀', fond:'linear-gradient(160deg,#160d3a,#35185e 60%,#1b0f3d)', items:['✦','✧','⭐','·'], anim:'scintille'},
  {id:'ocean', nom:'Océan', ico:'🐟', heros:'🐢', fond:'linear-gradient(180deg,#2a2a7a,#1d4f86 55%,#13336a)', items:['○','🐟'], anim:'monte'},
  {id:'ciel', nom:'Nuages', ico:'☁️', heros:'🐦', fond:'linear-gradient(180deg,#5a3aa0,#8a5ac0 60%,#6a3d9a)', items:['☁️'], anim:'derive'},
  {id:'dinos', nom:'Dinosaures', ico:'🦕', heros:'🦖', fond:'linear-gradient(160deg,#3a2a5e,#2e5a4a 70%,#24403a)', items:['🦕','🌿','🥚'], anim:'flotte'},
  {id:'licornes', nom:'Arc-en-ciel', ico:'🌈', heros:'🦄', fond:'linear-gradient(160deg,#6a2a86,#b0448f 60%,#5a2a7a)', items:['🌈','⭐','💖'], anim:'flotte'},
  {id:'jardin', nom:'Jardin', ico:'🌸', heros:'🐞', fond:'linear-gradient(160deg,#3c2470,#4a6a3a 75%,#2f4a2a)', items:['🌸','🍃','🦋'], anim:'tombe'},
];
const INTERVALLES = [10, 30, 60, 120, 180, 300, 600];
const fmtInt = s => s < 60 ? s + ' s' : (s / 60) + ' min';

/* ---------------- Données ---------------- */
function nouveauTableau(o) {
  return Object.assign({id:uid(), comportement:'', definition:'', picto:'⭐', couleur:'vert',
    recompense:{label:'', emoji:'🎁', photo:null}, nbJetons:5, objectif:'fixe', rv:1,
    mode:'manuel', intervalle:60, visuel:'camembert', univers:'bonbons', afficherNombre:false,
    felicitation:'Bravo !', etat:null}, o);
}
function donneesDemo() {
  return {
    version:2, courant:null, premierLancement:true,
    reglages:{son:true, vibration:true, voix:true},
    eleves:[{id:uid(), prenom:'Léo', seances:[], jetonsJour:{}, tableaux:[
      nouveauTableau({comportement:'Rester assis 5 min', definition:'Fesses sur la chaise, pieds sous la table.', picto:'🦕', couleur:'vert',
        recompense:{label:'10 min de dessin libre', emoji:'✏️'}, nbJetons:5, mode:'minuteur', intervalle:60, visuel:'escalier', univers:'dinos', felicitation:'Bravo, tu es resté assis !'}),
      nouveauTableau({comportement:'Ranger son matériel', definition:'Crayons dans la trousse, cahier dans le casier.', picto:'🚀', couleur:'nuit',
        recompense:{label:'Un tour de balançoire', emoji:'🎠'}, nbJetons:4, visuel:'fusee', univers:'espace', felicitation:'Super, tu as rangé !'}),
      nouveauTableau({comportement:'Lever le doigt', definition:'Lève la main et attend la parole, sans crier.', picto:'🐠', couleur:'turquoise',
        recompense:{label:'Une histoire en plus', emoji:'📖'}, nbJetons:6, objectif:'rv', rv:2, visuel:'verre', univers:'ocean', felicitation:'Bravo, tu as levé le doigt !'}),
      nouveauTableau({comportement:'Finir sa fiche', definition:'Termine les exercices du jour.', picto:'🍪', couleur:'peche',
        recompense:{label:'15 min de tablette', emoji:'🎮'}, nbJetons:4, mode:'deux', intervalle:120, visuel:'camembert', univers:'bonbons', felicitation:'Bravo, tu travailles bien !'}),
      nouveauTableau({comportement:'Attendre son tour', picto:'🚲', couleur:'lilas',
        recompense:{label:'Un tour de vélo', emoji:'🚲'}, nbJetons:3, visuel:'batterie', univers:'ciel', felicitation:'Bravo, tu as attendu !'}),
    ]}]
  };
}
function charger() {
  try { const d = JSON.parse(localStorage.getItem(CLE)); if (d && d.eleves) return d; } catch (e) {}
  const d = donneesDemo(); d.courant = d.eleves[0].id; return d;
}
let S = charger();
if (!S.courant || !S.eleves.find(e => e.id === S.courant)) S.courant = S.eleves[0] ? S.eleves[0].id : null;
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) { toast('Mémoire pleine : supprimez quelques photos'); } }
const eleve = () => S.eleves.find(e => e.id === S.courant);
const couleur = id => COULEURS.find(c => c.id === id) || COULEURS[0];
const univers = id => UNIVERS.find(u => u.id === id) || UNIVERS[0];
const titreTableau = t => (t.comportement || '').trim() || t.recompense.label || 'Tableau';

/* ---------------- Voix, vibration, sons doux, plein écran ---------------- */
function parler(t) {
  if (!S.reglages.voix || !S.reglages.son || !t) return;
  try {
    if (N && N.parler) { N.parler(t); return; }
    if ('speechSynthesis' in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'fr-FR'; u.rate = .95; speechSynthesis.speak(u); }
  } catch (e) {}
}
function vibrer(ms) { if (!S.reglages.vibration) return; try { if (N && N.vibrer) N.vibrer(ms); else if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function note(f, t0, d, type = 'sine', v = .14) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, c.currentTime + t0);
  g.gain.setValueAtTime(0, c.currentTime + t0); g.gain.linearRampToValueAtTime(v, c.currentTime + t0 + .03);
  g.gain.exponentialRampToValueAtTime(.001, c.currentTime + t0 + d);
  o.connect(g).connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + d + .05);
}
const GAMME = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568];
function sonJeton(p) { if (!S.reglages.son) return; const f = GAMME[Math.min(GAMME.length - 1, Math.floor(p * (GAMME.length - 1)))]; note(f, 0, .45, 'sine', .16); note(f * 1.5, .09, .5, 'sine', .08); }
function sonVictoire() { if (!S.reglages.son) return; [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => note(f, i * .12, .5, 'sine', .14)); }
function sonDoux() { if (!S.reglages.son) return; note(660, 0, .12, 'sine', .06); }
function pleinEcran(on) {
  try {
    if (N && N.pleinEcran) { N.pleinEcran(!!on); return; }
    if (on && document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
  } catch (e) {}
}

/* ---------------- Décor selon l'univers ---------------- */
function decor(idU) {
  const d = $('#deco');
  if (!idU) { d.style.background = ''; d.innerHTML = decoParDefaut; return; }
  const u = univers(idU);
  d.style.background = u.fond;
  let h = '';
  const nb = u.anim === 'derive' ? 6 : 16;
  for (let i = 0; i < nb; i++) {
    const it = u.items[i % u.items.length];
    const taille = it === '○' ? 10 + (i % 4) * 8 : (it.length > 1 || it.codePointAt(0) > 255 ? 22 + (i % 3) * 10 : 12 + (i % 3) * 6);
    const dur = {flotte:10 + i % 5 * 2, monte:8 + i % 6 * 2, derive:30 + i % 4 * 10, scintille:2 + i % 4, tombe:10 + i % 5 * 3}[u.anim];
    const style = `left:${(i * 37 + 7) % 100}%;top:${u.anim === 'monte' || u.anim === 'tombe' ? 0 : (i * 53 + 5) % 92}%;font-size:${u.anim === 'derive' ? 60 + (i % 3) * 30 : taille}px;animation-delay:${-i * 1.7}s;animation-duration:${dur}s;color:#ffd34d`;
    h += it === '○' ? `<span class="a-${u.anim} bulle-o" style="${style};width:${taille}px;height:${taille}px"></span>` : `<span class="a-${u.anim}" style="${style}">${it}</span>`;
  }
  d.innerHTML = h;
}
const decoParDefaut = (() => {
  const items = ['✦', '✦', '✧', '🍭', '🍬', '✦', '⭐', '✧']; let h = '';
  for (let i = 0; i < 12; i++) { const it = items[i % items.length]; h += `<span class="a-flotte" style="left:${(i * 83) % 100}%;top:${(i * 47 + 10) % 95}%;font-size:${it.length > 1 ? 22 : 14 + (i % 3) * 6}px;color:#ffd34d;opacity:.3;animation-delay:${-i * 1.3}s">${it}</span>`; }
  return h;
})();

/* ---------------- Navigation ---------------- */
let pile = [], ecranCourant = 'accueil';
function aller(nom, sansPile) {
  if (!sansPile && ecranCourant !== nom) pile.push(ecranCourant);
  document.querySelectorAll('.ecran').forEach(e => e.classList.remove('actif'));
  $('#ecran-' + nom).classList.add('actif'); ecranCourant = nom;
  if (nom !== 'seance' && nom !== 'victoire') decor(null);
  ({accueil:rendreAccueil, suivi:rendreSuivi, reperes:rendreReperes, reglages:rendreReglages}[nom] || (() => {}))();
}
function retour() {
  if ($('#voile').classList.contains('ouvert')) { fermerBoite(); return true; }
  if (ecranCourant === 'seance') { toast('Maintenez 🏠 Accueil pour quitter'); return true; }
  if (ecranCourant === 'victoire') { finVictoire(); return true; }
  if (ecranCourant === 'accueil') return false;
  const prec = pile.pop() || 'accueil';
  aller(['seance', 'victoire'].includes(prec) ? 'accueil' : prec, true);
  return true;
}
window.retour = retour;
function boite(html) { $('#boite').innerHTML = html; $('#voile').classList.add('ouvert'); }
function fermerBoite() { arreterCamera(); $('#voile').classList.remove('ouvert'); }
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2700); }
function confirmer(titre, texte, okTxt, fn, danger) {
  boite(`<h3>${esc(titre)}</h3><p style="opacity:.85;line-height:1.4">${texte}</p><div class="actions"><button class="btn-sec" onclick="fermerBoite()">Annuler</button>
    <button class="${danger ? 'btn-danger' : 'btn-or'}" id="ok-conf">${esc(okTxt)}</button></div>`);
  $('#ok-conf').onclick = () => { fermerBoite(); fn(); };
}
const recompVisuel = r => r && r.photo ? `<img src="${r.photo}" alt="">` : ((r && r.emoji) || '🎁');

/* =========================================================
   ACCUEIL (+ glisser-déposer)
   ========================================================= */
let vientDeGlisser = false;
function rendreAccueil() {
  const e = eleve();
  $('#titre-accueil').textContent = e ? 'Les tableaux de ' + e.prenom : 'Adaptjetons';
  $('#nom-eleve').textContent = e ? e.prenom : 'Ajouter un élève';
  const g = $('#grille-tableaux');
  $('#astuce-reorg').style.display = e && e.tableaux.length > 1 ? '' : 'none';
  if (!e) { g.innerHTML = '<div class="vide">Commencez par ajouter un élève.</div>'; return; }
  if (!e.tableaux.length) { g.innerHTML = '<div class="vide">Aucun tableau pour l\'instant.<br>Touchez « Nouveau tableau ».</div>'; return; }
  g.innerHTML = e.tableaux.map(t => {
    const c = couleur(t.couleur), et = t.etat;
    const pct = et ? Math.round(100 * Math.min(et.actuel, et.cible) / et.cible) : 0;
    const modeIco = {manuel:'👆', minuteur:'⏱️', deux:'👆⏱️'}[t.mode];
    return `<div class="carte ${c.sombre ? 'sombre' : ''}" data-id="${t.id}" style="background:${c.bg}">
      <span class="filigrane">${t.picto}</span>
      <div class="haut"><span class="pastille">${t.picto}</span>
        <span class="mini" title="Mode de gain">${modeIco}</span>
        <button class="mini" data-edit="${t.id}" aria-label="Modifier">✏️</button></div>
      <h3>${esc(titreTableau(t))}</h3>
      <div class="meta">${t.recompense.photo ? '🖼️' : t.recompense.emoji} ${esc(t.recompense.label)}</div>
      <div class="jauge"><i style="width:${pct}%"></i></div></div>`;
  }).join('');
  g.querySelectorAll('.carte').forEach(brancherCarte);
}
let drag = null;
function brancherCarte(c) {
  let tm = null, sx = 0, sy = 0;
  c.addEventListener('contextmenu', ev => ev.preventDefault());
  c.addEventListener('pointerdown', ev => {
    if (ev.target.closest('[data-edit]')) return;
    sx = ev.clientX; sy = ev.clientY; vientDeGlisser = false;
    tm = setTimeout(() => { tm = null; debutDrag(c, sx, sy); }, 450);
  });
  c.addEventListener('pointermove', ev => {
    if (tm && (Math.abs(ev.clientX - sx) > 8 || Math.abs(ev.clientY - sy) > 8)) { clearTimeout(tm); tm = null; }
  });
  const fin = () => { if (tm) { clearTimeout(tm); tm = null; } };
  c.addEventListener('pointerup', fin); c.addEventListener('pointercancel', fin);
  c.addEventListener('click', ev => {
    const ed = ev.target.closest('[data-edit]');
    if (ed) { editerTableau(ed.dataset.edit); return; }
    if (vientDeGlisser) { vientDeGlisser = false; return; }
    lancer(c.dataset.id);
  });
}
function debutDrag(c, x, y) {
  const r = c.getBoundingClientRect();
  const vol = c.cloneNode(true); vol.classList.add('carte-vol');
  vol.style.width = r.width + 'px'; vol.style.height = r.height + 'px';
  document.body.appendChild(vol);
  drag = {carte:c, vol, dx:x - r.left, dy:y - r.top};
  c.classList.add('fantome'); vibrer(30);
  // écouteurs globaux : déplacer la carte dans le DOM lui ferait perdre la capture du pointeur
  window.addEventListener('pointermove', dragMove); window.addEventListener('pointerup', dragFin); window.addEventListener('pointercancel', dragFin);
  bougeDrag(x, y);
}
function dragMove(ev) { if (drag) bougeDrag(ev.clientX, ev.clientY); }
function dragFin() {
  window.removeEventListener('pointermove', dragMove); window.removeEventListener('pointerup', dragFin); window.removeEventListener('pointercancel', dragFin);
  if (drag) finDrag();
}
function bougeDrag(x, y) {
  drag.vol.style.left = (x - drag.dx) + 'px'; drag.vol.style.top = (y - drag.dy) + 'px';
  const sous = document.elementFromPoint(x, y); const cible = sous && sous.closest('.carte');
  if (cible && cible !== drag.carte && cible.parentNode === drag.carte.parentNode) {
    const l = [...cible.parentNode.children];
    if (l.indexOf(cible) > l.indexOf(drag.carte)) cible.after(drag.carte); else cible.before(drag.carte);
  }
  const zone = $('#accueil-defile'), h = innerHeight;
  if (y > h - 140) zone.scrollTop += 10; else if (y < 120) zone.scrollTop -= 10;
}
function finDrag() {
  const e = eleve(); const ordre = [...$('#grille-tableaux').children].map(x => x.dataset.id);
  e.tableaux.sort((a, b) => ordre.indexOf(a.id) - ordre.indexOf(b.id)); sauver();
  drag.vol.remove(); drag.carte.classList.remove('fantome'); drag = null; vientDeGlisser = true;
  setTimeout(() => { vientDeGlisser = false; }, 400);
}
document.addEventListener('touchmove', ev => { if (drag) ev.preventDefault(); }, {passive:false});

/* ---- élèves ---- */
function boiteEleves() {
  const l = S.eleves.map(e => `<div class="ligne" style="margin-bottom:8px"><div class="ico">${e.id === S.courant ? '✅' : '👤'}</div>
      <div class="txt" onclick="choisirEleve('${e.id}')"><b>${esc(e.prenom)}</b><small>${e.tableaux.length} tableau(x)</small></div>
      <button class="btn-rond" onclick="renommerEleve('${e.id}')">✏️</button><button class="btn-rond" onclick="supprimerEleve('${e.id}')">🗑️</button></div>`).join('');
  boite(`<h3>Élèves</h3>${l || '<p>Aucun élève.</p>'}<div class="actions"><button class="btn-or" onclick="nouvelEleve()">＋ Ajouter un élève</button></div>`);
}
function choisirEleve(id) { S.courant = id; sauver(); fermerBoite(); rendreAccueil(); }
function saisirPrenom(titre, val, fn) {
  boite(`<h3>${titre}</h3><input class="saisie" id="in-prenom" maxlength="30" placeholder="Prénom" value="${esc(val)}">
    <div class="actions"><button class="btn-sec" onclick="fermerBoite()">Annuler</button><button class="btn-or" id="ok-prenom">Valider</button></div>`);
  const i = $('#in-prenom'); setTimeout(() => i.focus(), 100);
  const ok = () => { const v = i.value.trim(); if (!v) return; fermerBoite(); fn(v); };
  $('#ok-prenom').onclick = ok; i.onkeydown = ev => { if (ev.key === 'Enter') ok(); };
}
function nouvelEleve() { saisirPrenom('Nouvel élève', '', p => { const e = {id:uid(), prenom:p, tableaux:[], seances:[], jetonsJour:{}}; S.eleves.push(e); S.courant = e.id; sauver(); rendreAccueil(); }); }
function renommerEleve(id) { const e = S.eleves.find(x => x.id === id); saisirPrenom('Renommer', e.prenom, p => { e.prenom = p; sauver(); boiteEleves(); rendreAccueil(); }); }
function supprimerEleve(id) {
  const e = S.eleves.find(x => x.id === id);
  confirmer('Supprimer ' + e.prenom + ' ?', 'Ses tableaux et son historique seront effacés.', 'Supprimer', () => {
    S.eleves = S.eleves.filter(x => x.id !== id); if (S.courant === id) S.courant = S.eleves[0] ? S.eleves[0].id : null; sauver(); rendreAccueil();
  }, true);
}

/* =========================================================
   SÉANCE
   ========================================================= */
let T = null, sea = null, tick = null;
function tirerRV(r) { return r <= 1 ? 1 : alea(1, 2 * r - 1); }               // RV r : moyenne r
function tirerCible(t) {                                                    // objectif RV autour de n
  const n = t.nbJetons; if (t.objectif !== 'rv' || n <= 1) return n;
  const ecart = Math.max(1, Math.floor(n / 2)); return alea(Math.max(1, n - ecart), n + ecart);
}
function nouvelEtat(t) { return {actuel:0, cible:tirerCible(t), rvCompte:0, rvRequis:tirerRV(t.rv), debut:Date.now(), acc:0}; }
function lancer(id) {
  const e = eleve(); T = e.tableaux.find(t => t.id === id); if (!T) return;
  ac();
  if (!T.etat || T.etat.actuel >= T.etat.cible) T.etat = nouvelEtat(T);
  sauver();
  sea = {debutSeance:Date.now(), jetonsAjoutes:0, pause:false, dernier:Date.now(), fini:false};
  $('#s-renfo').innerHTML = `${T.recompense.photo ? `<img src="${T.recompense.photo}" alt="">` : `<span>${T.recompense.emoji}</span>`}<span>${esc(T.recompense.label || 'Une surprise')}</span>`;
  $('#s-comport').textContent = (T.comportement || '').trim();
  decor(T.univers);
  aller('seance', true); pile = ['accueil'];
  pleinEcran(true);
  initVisuel(); majVisuel(false);
  rendreZoneBtn(); rendreBarreParent();
  clearInterval(tick); tick = setInterval(boucle, 200);
}
const avecMinuteur = () => T.mode === 'minuteur' || T.mode === 'deux';
const avecManuel = () => T.mode === 'manuel' || T.mode === 'deux';
function rendreZoneBtn() {
  const z = $('#zone-btn'); let h = '';
  if (avecMinuteur()) h += `<div class="chrono ${T.mode === 'minuteur' ? 'grand' : ''}" id="chrono"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="6"/>
      <circle id="chrono-arc" cx="22" cy="22" r="18" fill="none" stroke="#ffd34d" stroke-width="6" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="113.1"/></svg><span id="chrono-txt"></span></div>`;
  if (avecManuel()) h += `<button class="btn-or" id="btn-plus" onclick="clicPlus()">${T.rv > 1 ? '＋ Une réponse' : '＋ Un jeton'}</button>`;
  z.innerHTML = h;
}
function boucle() {
  if (!T || !sea || sea.fini) return;
  const now = Date.now(), dt = Math.min(1000, now - sea.dernier); sea.dernier = now;
  if (!avecMinuteur()) return;
  const et = T.etat, I = T.intervalle * 1000;
  if (!sea.pause) {
    et.acc += dt;
    if (et.acc >= I) { et.acc -= I; ajouterJeton(); if (sea.fini) return; }
  }
  const arc = $('#chrono-arc'), txt = $('#chrono-txt'); if (!arc) return;
  arc.setAttribute('stroke-dashoffset', 113.1 * (1 - et.acc / I));
  const r = Math.ceil((I - et.acc) / 1000);
  txt.textContent = sea.pause ? '⏸ En pause' : `${Math.floor(r / 60)}:${String(r % 60).padStart(2, '0')}`;
  $('#chrono').classList.toggle('pause', sea.pause);
}
function clicPlus() {
  if (!T || sea.fini) return;
  const et = T.etat;
  if (T.rv > 1) {
    et.rvCompte++;
    const b = $('#btn-plus'); b.classList.remove('pulse-rv'); void b.offsetWidth; b.classList.add('pulse-rv');
    if (et.rvCompte < et.rvRequis) { sonDoux(); vibrer(15); sauver(); majCompteur(); return; }
    et.rvCompte = 0; et.rvRequis = tirerRV(T.rv);
  }
  ajouterJeton();
}
function ajouterJeton() {
  const et = T.etat; if (et.actuel >= et.cible) return;
  et.actuel++; sea.jetonsAjoutes++;
  const e = eleve(), d = jour(); e.jetonsJour[d] = (e.jetonsJour[d] || 0) + 1;
  sauver();
  sonJeton(et.actuel / et.cible); vibrer(40);
  majVisuel(true);
  const p = document.createElement('div'); p.className = 'plus1'; p.textContent = '+1'; $('#vis').appendChild(p); setTimeout(() => p.remove(), 1100);
  if (et.actuel < et.cible) {
    if (T.felicitation) {
      const b = document.createElement('div'); b.className = 'bulle'; b.textContent = T.felicitation;
      $('#vis').appendChild(b); setTimeout(() => b.remove(), 2300); parler(T.felicitation);
    }
  } else {
    sea.fini = true; const bp = $('#btn-plus'); if (bp) bp.disabled = true;
    if (T.visuel === 'fusee') { setTimeout(decollage, 700); setTimeout(victoire, 2300); }
    else setTimeout(victoire, 1300);
  }
}

function majCompteur() {

  c.textContent = `${et.actuel} / ${et.cible}` + (T.rv > 1 ? `  ·  RV ${T.rv} : ${et.rvCompte}/${et.rvRequis}` : '');
}
function majVisuel(anim) {
  const et = T.etat, p = Math.min(1, et.actuel / et.cible);
  if (T.visuel === 'escalier') {
    const box = $('#esc'), W = box.clientWidth - 50, H = box.clientHeight - 60, n = et.cible, w = W / n, h = H / n;

    for (let i = 0; i < et.actuel; i++) {
      box.insertAdjacentHTML('beforeend', `<div class="marche ${anim && i === et.actuel - 1 ? 'neuve' : ''}" style="left:${i * w}px;width:${w - 3}px;height:${(i + 1) * h}px;background:${cols[i % cols.length]}"></div>`);
    }
    const hr = $('#heros');
    hr.style.left = (et.actuel ? (et.actuel - 1) * w + w / 2 : -4) + 'px';
    hr.style.bottom = (et.actuel * h - 4) + 'px';

}
function decollage() {

  if (S.reglages.son) { for (let i = 0; i < 8; i++) note(200 + i * 60, i * .1, .3, 'triangle', .05); }

/* ---------------- Barre parent (appui long) ---------------- */
function rendreBarreParent() {
  const b = [
    {id:'accueil', ico:'🏠', txt:'Accueil'},
    {id:'son', ico:S.reglages.son ? '🔊' : '🔇', txt:'Son'},
    {id:'nombre', ico:T.afficherNombre ? '🔢' : '👁️', txt:T.afficherNombre ? 'Cacher' : 'Nombre'},
  ];
  if (avecMinuteur()) b.push({id:'pause', ico:sea.pause ? '▶️' : '⏸️', txt:sea.pause ? 'Reprendre' : 'Pause'});
  b.push({id:'recommencer', ico:'↻', txt:'Recommencer'});
  $('#barre-parent').innerHTML = b.map(x => `<button class="bp" data-act="${x.id}">${x.ico}<small>${x.txt}</small></button>`).join('');
  $('#barre-parent').querySelectorAll('.bp').forEach(el => appuiLong(el, () => actionParent(el.dataset.act), 'Maintenez pour : ' + el.querySelector('small').textContent));
}
function appuiLong(el, fn, msg) {
  let tm = null, fait = false;
  const fin = () => { clearTimeout(tm); tm = null; el.classList.remove('charge'); };
  el.addEventListener('pointerdown', () => { fait = false; el.classList.add('charge'); tm = setTimeout(() => { fait = true; fin(); vibrer(30); fn(); }, 800); });
  el.addEventListener('pointerup', () => { if (tm && !fait) toast(msg); fin(); });
  el.addEventListener('pointerleave', fin); el.addEventListener('pointercancel', fin);
  el.addEventListener('contextmenu', ev => ev.preventDefault());
}
function actionParent(a) {
  if (a === 'accueil') quitterSeance();
  else if (a === 'son') { S.reglages.son = !S.reglages.son; sauver(); rendreBarreParent(); }
  else if (a === 'nombre') { T.afficherNombre = !T.afficherNombre; sauver(); majCompteur(); rendreBarreParent(); }
  else if (a === 'pause') { sea.pause = !sea.pause; rendreBarreParent(); boucle(); }
  else if (a === 'recommencer') {
    if (sea.jetonsAjoutes > 0) journaliser(false);
    T.etat = nouvelEtat(T); sauver(); sea = {debutSeance:Date.now(), jetonsAjoutes:0, pause:false, dernier:Date.now(), fini:false};
    initVisuel(); majVisuel(false); rendreZoneBtn(); rendreBarreParent(); toast('Tableau remis à zéro');
  }
}
function quitterSeance() {
  clearInterval(tick);
  if (sea && sea.jetonsAjoutes > 0 && !sea.fini) journaliser(false);
  sea = null; pleinEcran(false); aller('accueil', true); pile = [];
}
function journaliser(termine) {
  const e = eleve(), et = T.etat;
  e.seances.push({date:Date.now(), tableauId:T.id, titre:titreTableau(T), recompense:T.recompense.label,
    mode:T.mode, objectif:T.objectif === 'rv' ? 'RV ' + T.nbJetons : 'Fixe ' + T.nbJetons, rv:T.rv,
    cible:et.cible, gagnes:et.actuel, duree:Math.round((Date.now() - et.debut) / 1000), termine});
  if (e.seances.length > 1000) e.seances = e.seances.slice(-1000);
  sauver();
}

/* =========================================================
   VICTOIRE
   ========================================================= */
function fmtDuree(s) { if (s < 60) return s + ' s'; const m = Math.floor(s / 60); return m + ' min' + (s % 60 ? ' ' + String(s % 60).padStart(2, '0') + ' s' : ''); }
function victoire() {
  clearInterval(tick); journaliser(true);
  const e = eleve(), et = T.etat, d = Math.round((Date.now() - et.debut) / 1000);
  $('#v-bravo').textContent = 'Bravo ' + e.prenom + ' !';
  $('#v-ico').innerHTML = recompVisuel(T.recompense);
  $('#v-txt').textContent = T.recompense.label || 'Tu as gagné !';
  $('#v-duree').textContent = `Durée : ${fmtDuree(d)} • ${fmtDuree(Math.round(d / et.cible))} par jeton`;
  aller('victoire', true);
  sonVictoire(); vibrer(200);
  parler('Bravo ' + e.prenom + ' ! Tu as gagné : ' + (T.recompense.label || 'une surprise'));
  confettis();
}
function recommencer() { stopConfettis(); T.etat = nouvelEtat(T); sauver(); lancer(T.id); }
function finVictoire() { stopConfettis(); T.etat = null; sauver(); pleinEcran(false); aller('accueil', true); pile = []; }
let confAnim = null;
function confettis() {
  const cv = $('#confettis'), ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const cols = ['#ffd34d', '#ff8fbd', '#8fe6f2', '#b8f29b', '#fff', '#b393ff', '#ffaf62'];
  const P = Array.from({length:140}, () => ({x:Math.random() * cv.width, y:-Math.random() * cv.height, vx:(Math.random() - .5) * 2, vy:2 + Math.random() * 4,
    s:(6 + Math.random() * 8) * dpr, r:Math.random() * 6, vr:(Math.random() - .5) * .2, c:cols[Math.floor(Math.random() * cols.length)]}));
  const t0 = Date.now();
  const pas = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    P.forEach(p => { p.x += p.vx * dpr; p.y += p.vy * dpr; p.r += p.vr;
      if (p.y > cv.height && Date.now() - t0 < 4000) { p.y = -20; p.x = Math.random() * cv.width; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); });
    if (Date.now() - t0 < 9000) confAnim = requestAnimationFrame(pas);
  };
  stopConfettis(); pas();
}
function stopConfettis() { cancelAnimationFrame(confAnim); const cv = $('#confettis'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }

function enregistrerTableau() {
  ED.recompense.label = (ED.recompense.label || '').trim(); ED.comportement = (ED.comportement || '').trim();
  if (!ED.recompense.label) { toast('Indiquez la récompense'); $('#ed-recomp').focus(); return; }
  const e = eleve();
  if (ED.id) {
    const i = e.tableaux.findIndex(x => x.id === ED.id), ancien = e.tableaux[i];
    if (ED.etat && (ancien.nbJetons !== ED.nbJetons || ancien.objectif !== ED.objectif)) ED.etat = null; // nouveau réglage = nouveau départ
    e.tableaux[i] = ED;
  } else { ED.id = uid(); e.tableaux.push(ED); }
  sauver(); aller('accueil', true); pile = []; toast('Tableau enregistré');
}
function dupliquerTableau() {
  const e = eleve(), c = JSON.parse(JSON.stringify(ED)); c.id = uid(); c.etat = null; if (c.comportement) c.comportement += ' (copie)'; else c.recompense.label += ' (copie)';
  e.tableaux.push(c); sauver(); aller('accueil', true); pile = []; toast('Tableau dupliqué');
}
function supprimerTableau() {
  confirmer('Supprimer ce tableau ?', esc(titreTableau(ED)), 'Supprimer', () => { const e = eleve(); e.tableaux = e.tableaux.filter(x => x.id !== ED.id); sauver(); aller('accueil', true); pile = []; }, true);
}

/* ---------------- Photos ---------------- */
let flux = null, cameraFace = 'environment';
function photoPour(mode) { if (mode === 'galerie') { $('#fichier-image').value = ''; $('#fichier-image').click(); } else ouvrirCamera(); }
function ouvrirCamera() {
  boite(`<h3>📷 Photo de la récompense</h3><div class="camera"><video id="video" autoplay playsinline muted></video></div>
    <div class="actions"><button class="btn-sec" onclick="fermerBoite()">Annuler</button><button class="btn-sec" onclick="cameraFace=cameraFace==='environment'?'user':'environment';demarrerFlux()">🔄</button>
    <button class="btn-or" onclick="capturer()">📸 Prendre</button></div>`);
  demarrerFlux();
}
function demarrerFlux() {
  arreterCamera();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Caméra indisponible : utilisez la galerie'); return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:cameraFace, width:{ideal:1280}}, audio:false})
    .then(s => { flux = s; const v = $('#video'); if (v) v.srcObject = s; }).catch(() => toast('Caméra refusée : utilisez la galerie'));
}
function arreterCamera() { if (flux) { flux.getTracks().forEach(t => t.stop()); flux = null; } }
function capturer() { const v = $('#video'); if (!v || !v.videoWidth) return; const d = redim(v, v.videoWidth, v.videoHeight); fermerBoite(); appliquerPhoto(d); }
function redim(src, w, h) {
  const c = Math.min(w, h), cv = document.createElement('canvas'); cv.width = cv.height = Math.min(420, c);
  cv.getContext('2d').drawImage(src, (w - c) / 2, (h - c) / 2, c, c, 0, 0, cv.width, cv.height); return cv.toDataURL('image/jpeg', .8);
}
$('#fichier-image').addEventListener('change', ev => {
  const f = ev.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => { const d = redim(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(url); appliquerPhoto(d); };
  img.onerror = () => toast('Image illisible'); img.src = url;
});
function appliquerPhoto(d) { if (ED) { ED.recompense.photo = d; rendreEditeur(); } }

function rendreSuivi() {
  const e = eleve(), c = $('#suivi-corps'); if (!e) { c.innerHTML = ''; return; }

  const jours = []; for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); jours.push(d); }
  const vals = jours.map(d => e.jetonsJour[jour(d)] || 0), max = Math.max(4, ...vals);
  const rec = jours.map(d => e.seances.filter(s => s.termine && jour(new Date(s.date)) === jour(d)).length);
  const W = 560, H = 170, bw = W / 14;
  const barres = vals.map((v, i) => { const h = (v / max) * (H - 44);
    return `<rect x="${i * bw + 6}" y="${H - 22 - h}" width="${bw - 12}" height="${h}" rx="6" fill="#ffd34d"/>${v ? `<text x="${i * bw + bw / 2}" y="${H - 27 - h}" text-anchor="middle" font-size="12" fill="#fff" font-weight="800">${v}</text>` : ''}
      ${rec[i] ? `<text x="${i * bw + bw / 2}" y="${H - 28 - h - (v ? 14 : 0)}" text-anchor="middle" font-size="12">🎁${rec[i] > 1 ? rec[i] : ''}</text>` : ''}
      <text x="${i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.7)">${jours[i].getDate()}</text>`; }).join('');
  const parTab = e.tableaux.map(t => { const s = e.seances.filter(x => x.tableauId === t.id && x.termine);
    const moy = s.length ? Math.round(s.slice(-5).reduce((a, x) => a + x.duree, 0) / Math.min(5, s.length)) : 0;
    return `<tr><td>${t.picto} ${esc(titreTableau(t))}</td><td>${s.length}</td><td>${moy ? fmtDuree(moy) : '—'}</td></tr>`; }).join('');
  const modeTxt = {manuel:'Manuel', minuteur:'Minuteur', deux:'Les deux'};
  const dern = e.seances.slice(-40).reverse().map(s => { const d = new Date(s.date);
    return `<tr><td>${d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'})}<br><small>${d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}</small></td>

  c.innerHTML = `
    <div class="barre"><button class="btn-rond" onclick="retour()">←</button><h2>Historique de ${esc(e.prenom)}</h2></div>
    <div class="stats"><div class="stat"><b>${e.jetonsJour[auj] || 0}</b><small>jetons aujourd'hui</small></div>
      <div class="stat"><b>${e.seances.filter(s => s.termine && jour(new Date(s.date)) === auj).length}</b><small>récompenses aujourd'hui</small></div>
      <div class="stat"><b>${e.seances.filter(s => s.termine).length}</b><small>récompenses au total</small></div></div>
    <div style="display:flex;gap:10px;margin-bottom:14px"><button class="btn-or" onclick="exporterCSV()">⬇ Exporter en CSV</button></div>
    <div class="carte-info"><h3>Jetons gagnés — 14 derniers jours</h3><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${barres}</svg>
      <p class="aide">🎁 = récompense obtenue ce jour-là.</p></div>
    <div class="carte-info"><h3>Par tableau</h3><div class="tab-defile"><table class="suivi"><tr><th>Tableau</th><th>Récompenses</th><th>Durée moy.*</th></tr>${parTab || '<tr><td colspan=3>—</td></tr>'}</table></div>
      <p class="aide">* moyenne des 5 dernières séances terminées. Si elle augmente beaucoup ou si l'élève abandonne, l'objectif est peut-être trop élevé ou la récompense ne le motive plus.</p></div>
    <div class="carte-info"><h3>Séances</h3><div class="tab-defile"><table class="suivi"><tr><th>Date</th><th>Tableau</th><th>Jetons</th><th>Durée</th><th></th></tr>${dern || '<tr><td colspan=5>Aucune séance enregistrée.</td></tr>'}</table></div>
      <p class="aide">🎁 récompense obtenue · ⏹ séance interrompue</p></div>
    <button class="btn-sec" style="width:100%" onclick="effacerSuivi()">🗑️ Effacer l'historique de ${esc(e.prenom)}</button>`;
}
function exporterCSV() {
  const e = eleve(), q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const modeTxt = {manuel:'Manuel', minuteur:'Minuteur', deux:'Minuteur + manuel'};
  const lignes = [['Élève', 'Date', 'Heure', 'Tableau', 'Récompense', 'Gain des jetons', 'Objectif', 'RV par jeton', 'Jetons visés', 'Jetons gagnés', 'Durée (s)', 'Terminée'].map(q).join(';')];
  e.seances.forEach(s => { const d = new Date(s.date);
    lignes.push([e.prenom, d.toLocaleDateString('fr-FR'), d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}), s.titre, s.recompense, modeTxt[s.mode] || '', s.objectif, s.rv || 1, s.cible, s.gagnes, s.duree, s.termine ? 'oui' : 'non'].map(q).join(';')); });
  enregistrerFichier('historique-' + e.prenom.toLowerCase().replace(/[^a-z0-9]+/gi, '-') + '-' + jour() + '.csv', '﻿' + lignes.join('\r\n'), 'text/csv');
}
function effacerSuivi() {
  const e = eleve();
  confirmer('Effacer l\'historique ?', 'Les séances et jetons de ' + esc(e.prenom) + ' seront effacés. Les tableaux sont conservés.', 'Effacer', () => { e.seances = []; e.jetonsJour = {}; sauver(); rendreSuivi(); }, true);
}
function enregistrerFichier(nom, txt, mime) {
  if (N && N.sauverFichierType) { N.sauverFichierType(nom, txt, mime); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:mime})); a.download = nom; a.click();
  toast('Fichier téléchargé');
}
